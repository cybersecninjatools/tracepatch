name: Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-changelog:
    # Skip pushes made by this workflow itself to avoid an infinite loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Append changelog entry
        run: |
          set -euo pipefail

          hash="$(git rev-parse --short HEAD)"
          date="$(git show -s --format=%cs HEAD)"
          message="$(git log -1 --format=%s HEAD)"

          lower_message="$(echo "$message" | tr '[:upper:]' '[:lower:]')"
          if echo "$lower_message" | grep -qE 'fix|bug|error'; then
            type="fix"
          elif echo "$lower_message" | grep -qE 'remove|delete|drop'; then
            type="remove"
          else
            type="add"
          fi

          python3 - "$hash" "$date" "$type" "$message" <<'EOF'
          import json
          import sys
          from pathlib import Path

          commit, date, change_type, message = sys.argv[1:5]
          path = Path("CHANGELOG.json")

          if path.exists():
              entries = json.loads(path.read_text() or "[]")
          else:
              entries = []

          entries.append({
              "commit": commit,
              "date": date,
              "changes": [
                  {"type": change_type, "text": message}
              ]
          })

          path.write_text(json.dumps(entries, indent=2) + "\n")
          EOF

      - name: Commit changelog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.json
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "chore: update changelog [skip ci]"
          git push
